kind = "web"
previewPath = "/"
title = "DÉSIGN SAÂDA"
description = "An Arabic-first online showroom for DÉSIGN SAÂDA, a Mohammedia upholstery and modern interior studio. Visitors can browse real project photos, filter services, request custom dimensions, and send selections to WhatsApp."
version = "1.0.0"
id = "artifacts/design-saada"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21136

[services.development]
run = "pnpm --filter @workspace/design-saada run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/design-saada", "run", "build" ]
serve = "static"
publicDir = "artifacts/design-saada/dist"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21136"
BASE_PATH = "/"
